{% extends "base.html" %}
{% block main %}

<div class="slideshow h-screen flex gap-[4vw] overflow-x-scroll overscroll-x-contain snap-x snap-mandatory hover:scroll-smooth">
  {% for photo in photos %}
    <figure class="shrink-0 w-full h-full flex items-center justify-center snap-start">
      <img loading="lazy" src="{{ photo.url }}" class="max-w-full max-h-full object-contain" />
    </figure>
  {% endfor %}
</div>

{% endblock %}
