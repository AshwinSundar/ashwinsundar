<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ashwin Sundar{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/o.tw.css">
  <link rel="stylesheet" href="/static/css/pygments.css">
  <link rel="alternate" type="application/rss+xml" title="Ashwin Sundar" href="/index.xml">
  {% block head %}{% endblock %}
  <script defer type="text/javascript" src="/static/alpinejs-3.17.1.min.js"></script>
  <script type="text/javascript" src="/static/alpinejs-persist-3.17.1.min.js"></script>
  <script>
    MathJax = {
      tex: {
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        inlineMath: [['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>
</head>
<!-- class="flex justify-center bg-[#ececec] dark:bg-blue-950 *:font-mono p-4" -->
<body
  class="flex justify-center bg-[#ececec] dark:bg-blue-950 *:font-mono p-4"
  :class="{
    'bg-vaporwave-horizon': activeBg === 'horizon',
    'bg-vaporwave-f40': activeBg === 'f40',
    'bg-napoleon-wings': activeBg === 'napoleon_wings'
  }"
  x-data="{ activeBg: $persist(null) }"
>
  <main 
    class="flex flex-col justify-between p-4 md:p-8 max-w-3xl w-full bg-paper border-black border shadow-[3px_3px_rgba(0,0,0,0.25)]"
    :class="activeBg ? 'mt-12 mb-48' : ''"
  >

    {% include "header.html" %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
