<div class="group relative inline-block w-fit h-fit">
  <span
    class="absolute translate-x-[3px] translate-y-[3px] inset-0 {% block tw_color %}{% endblock tw_color %}"
  ></span>
  <div class="relative inline-block border bg-white cursor-pointer group-hover:translate-x-[1px] group-hover:translate-y-[1px] delay-50 duration-300 group-active:translate-x-[2px] group-active:translate-y-[2px]">
    {% block body %}
    {% endblock body %}
  </div>
</div>
